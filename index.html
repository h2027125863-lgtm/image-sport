<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<style>

html,body{
    margin:0;
    padding:0;
    background:transparent;
    overflow:hidden;
}


/*整体比例*/
.container{

    width:100%;
    height:auto;
    position:relative;

}


/*原图*/
.chart{

    width:100%;
    display:block;

    clip-path: inset(0 100% 0 0);

    animation:
    reveal 5s ease forwards;

}


/*图片慢慢出现*/

@keyframes reveal{

0%{
clip-path:inset(0 100% 0 0);
}

100%{
clip-path:inset(0 0 0 0);
}

}



/*文字层*/

.text{

position:absolute;
right:0;
top:0;

opacity:0;

animation:

textShow 5s ease forwards;

animation-delay:2s;

}


/*文字淡入*/

@keyframes textShow{


0%{

opacity:0;

transform:translateY(20px);

}


100%{

opacity:1;

transform:translateY(0);

}


}


</style>

</head>


<body>


<div class="container">


<img 
class="chart"
src="chart.png">


</div>


</body>

</html>
